; Raises PHP-FPM's per-request limits for this app specifically, without
; needing root access to the server's main php.ini — the standard approach
; on shared hosting (Hostinger included), since PHP-FPM reads .user.ini
; files from the directory containing the executing script (public/index.php).
;
; Sized for lecture video uploads: 720p MP4, capped at 500MB by the
; application's own validation in CourseController — these are set a
; little above that ceiling so the upload itself isn't rejected before
; Laravel gets a chance to validate and give a proper error message.
upload_max_filesize = 550M
post_max_size = 560M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
